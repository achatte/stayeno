<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Stayeno app icon: house with a key (door codes) and a thermometer (climate) -->
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <!-- chimney -->
  <rect x="338" y="112" width="36" height="78" rx="4" fill="#1d4ed8"/>
  <!-- house outline -->
  <path d="M256 88 L440 236 L408 236 L408 424 L104 424 L104 236 L72 236 Z"
        fill="none" stroke="#1d4ed8" stroke-width="30" stroke-linejoin="round"/>
  <!-- key -->
  <circle cx="186" cy="262" r="36" fill="none" stroke="#1d4ed8" stroke-width="20"/>
  <rect x="176" y="296" width="20" height="96" rx="6" fill="#1d4ed8"/>
  <rect x="196" y="340" width="26" height="16" rx="4" fill="#1d4ed8"/>
  <rect x="196" y="368" width="20" height="16" rx="4" fill="#1d4ed8"/>
  <!-- thermometer -->
  <rect x="300" y="226" width="46" height="140" rx="23" fill="#ffffff" stroke="#1d4ed8" stroke-width="12"/>
  <rect x="314" y="268" width="18" height="100" rx="9" fill="url(#heat)"/>
  <circle cx="323" cy="374" r="30" fill="#ef4444" stroke="#1d4ed8" stroke-width="12"/>
  <path d="M352 256 h16 M352 286 h16 M352 316 h16" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
</svg>
